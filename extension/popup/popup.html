<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>web-tool</title>
<style>
  body { width: 380px; margin: 0; font: 13px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; }
  .wrap { padding: 12px; }
  h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
  h1 img { width: 18px; height: 18px; }
  .row { display: flex; gap: 6px; margin-bottom: 8px; }
  input[type=text] { flex: 1; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
  button { padding: 6px 12px; border: 0; border-radius: 6px; background: #1a6df0; color: #fff; cursor: pointer; font-size: 13px; white-space: nowrap; }
  button.secondary { background: #eee; color: #1a1a1a; }
  button:hover { filter: brightness(1.05); }
  .meta { color: #666; font-size: 12px; margin-bottom: 6px; word-break: break-all; }
  textarea { width: 100%; height: 260px; border: 1px solid #ddd; border-radius: 6px; padding: 8px; box-sizing: border-box; font: 12px/1.6 monospace; resize: vertical; }
  .bar { display: flex; gap: 6px; margin-top: 8px; }
  .status { margin-top: 6px; font-size: 12px; color: #c0392b; min-height: 16px; }
  .copy-ok { color: #27ae60; }
  .spa { color: #e67e22; }
</style>
</head>
<body>
<div class="wrap">
  <h1><img src="../icons/icon-32.png" alt=""> web-tool 提取器</h1>
  <div class="row">
    <input type="text" id="url" placeholder="输入 URL 抓取（跨域，真实指纹）">
    <button id="btn-fetch">抓取</button>
  </div>
  <div class="row">
    <button id="btn-current" class="secondary">提取当前页</button>
  </div>
  <div id="meta" class="meta"></div>
  <textarea id="out" placeholder="提取结果…" readonly></textarea>
  <div class="bar">
    <button id="btn-copy" class="secondary">复制</button>
    <button id="btn-clear" class="secondary">清空</button>
  </div>
  <div id="status" class="status"></div>
</div>
<script src="popup.js"></script>
</body>
</html>
